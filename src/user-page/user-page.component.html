<app-create-user></app-create-user>
<app-users-filter (valueChanges)="onFilterUsers($event)" />
<div class="container-users">
  <div class="users-list">
    @for (user of users$ | async; track user.id) {
    <app-user 
      [user]="user"
      (deletUser)="userService.deleteUser($event)"
    />
    } @empty {
      <p class="empty-message fs-26">Нет пользователей для отображения</p>
    }
  </div>
  <img 
    (click)="updateUsers()" 
    class="update-user" src="/images/service/update-icon.svg" 
    alt="обновить пользователей">
</div>
