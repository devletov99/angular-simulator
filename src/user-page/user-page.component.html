<app-create-user (onSubmitForm)="onSubmit($event)"/>
<app-users-filter (onFilter)="onFilterUsers($event)"/>
<div class="container-users">
  <div class="users-list">
    @for (user of users$ | async; track user.id) {
    <app-user 
      [user]="user"
      (onDeleteUser)="userService.deleteUser(user)"
    />
    } @empty {
      <p class="empty-message fs-26">Нет пользователей для отображения</p>
    }
  </div>
  <button id="update-users" class="primary-button update-users" (click)="updateUsers()">обовить пользователей</button>
